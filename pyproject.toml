[project]
name = "base"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "aiogram[redis]>=3.20.0.post0",
    "asyncpg>=0.30.0",
    "babel>=2.17.0",
    "boto3>=1.38.33",
    "cryptography>=45.0.2",
    "fastapi>=0.116.1",
    "greenlet>=3.2.4",
    "gunicorn>=23.0.0",
    "matplotlib>=3.10.3",
    "openai>=1.101.0",
    "python-dotenv>=1.1.0",
    "sqlalchemy>=2.0.43",
    "streamlit>=1.46.1",
    "streamlit-option-menu>=0.4.0",
    "uvicorn>=0.35.0",
    "yookassa>=3.5.0",
]

[tool.ruff]
line-length = 142
indent-width = 4
target-version = "py312"
extend-exclude = ["tests", "handle-all.py"]

[tool.ruff.lint]
select = ["ALL"]
fixable = ["ALL"]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-line-length = "dynamic"
