[project]
name = "base"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "aiogram[redis]>=3.20.0.post0",
    "boto3>=1.38.33",
    "cryptography>=45.0.2",
    "matplotlib>=3.10.3",
    "openai>=1.85.0",
    "python-dotenv>=1.1.0",
    "yookassa>=3.5.0",
]

[tool.ruff]
line-length = 142
indent-width = 4
target-version = "py312"
extend-exclude = ["tests", "handle-all.py"]

[tool.ruff.lint]
select = ["ALL"]
fixable = ["ALL"]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-line-length = "dynamic"
