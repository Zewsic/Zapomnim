name: Build Docker Image

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

env:
  REG_HOST: cr.selcloud.ru
  REG_NAME: zapomnim
  IMAGE: base

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to Selectel
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REG_HOST }}
          username: token
          password: ${{ secrets.SELECTEL_TOKEN }}

      - name: Generate tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REG_HOST }}/${{ env.REG_NAME }}/${{ env.IMAGE }}

      - name: Get Github Data
        run: |
          echo "BRANCH=$(echo ${GITHUB_REF##*/} | tr '/' '-')" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::8}"                  >> "$GITHUB_ENV"

      - name: Build and push docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REG_HOST }}/${{ env.REG_NAME }}/${{ env.IMAGE }}:${{ env.BRANCH }}-${{ env.SHORT_SHA }}
            ${{ env.REG_HOST }}/${{ env.REG_NAME }}/${{ env.IMAGE }}:${{ env.BRANCH }}-latest
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: true

